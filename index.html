<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sejeong Lee — Product Designer</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#FAFAF8; overflow:hidden; width:100vw; height:100vh;
  font-family:'Pretendard',-apple-system,'Helvetica Neue',sans-serif;
}
/* 밝기↓·대비↑ — 배경은 scene.background 사전 보정으로 순백 유지됨 */
#c { display:block; filter: brightness(0.94) contrast(1.12); }
#overlay {
  position:fixed; inset:0; background:#FFFFFF; opacity:0;
  pointer-events:none; transition:opacity .6s ease; z-index:99;
}
#overlay.go { opacity:1; pointer-events:all; }
/* ── Figma 1:35 — Pretendard Bold 20/28, #000, top 20px, left/right 24px ── */
.corner {
  position:fixed; top:20px; z-index:10; pointer-events:none;
  font-size:20px;
  line-height:28px; color:#000; letter-spacing:0;
  font-weight:700;
}
.corner.left  { left:24px;  text-align:left; }
.corner.right { right:24px; text-align:right; }
.corner b { font-weight:700; }
</style>
</head>
<body>
<div class="corner left"><b>SEJEONG LEE</b><br>Product Designer</div>
<div class="corner right">Seoul, Korea<br><b>whynotblair@gmail.com</b></div>
<canvas id="c"></canvas>
<div id="overlay"></div>

<script src="data/mac3d-assets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

// 캔버스 CSS 필터(brightness .94 / contrast 1.12) 통과 후 #FAFAF8이 되도록 사전 보정
const BG = 0xFCFCFA;
const DEG = Math.PI / 180;

// ── Renderer / Scene / Camera (고정 카메라 — 드래그 회전 없음) ─────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
camera.position.set(0, 5.0, 18.6);
camera.lookAt(0, 1.37, 0);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── Lighting — 밝고 부드러운 키노트 렌더 (좌상단이 살짝 밝음) ──────────────
// 앰비언트를 낮추고 키 라이트를 올려 면 간 명암 정의(디피니션) 강화
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xE2E2E2, 0.70));

const keyL = new THREE.DirectionalLight(0xFFFFFF, 0.62);  // 좌상단 키 (거의 머리 위)
keyL.position.set(-1.2, 18, 10);
keyL.castShadow = true;
keyL.shadow.mapSize.set(2048, 2048);
keyL.shadow.camera.near = 1;  keyL.shadow.camera.far = 34;
keyL.shadow.camera.left = -9; keyL.shadow.camera.right = 9;
keyL.shadow.camera.top = 9;   keyL.shadow.camera.bottom = -9;
keyL.shadow.bias = -0.0004;
keyL.shadow.radius = 12;
scene.add(keyL);

const fillR = new THREE.DirectionalLight(0xFFFFFF, 0.16); // 우측 필
fillR.position.set(6, 5, 5);
scene.add(fillR);

const fillF = new THREE.DirectionalLight(0xFFFFFF, 0.12); // 정면 필
fillF.position.set(0, 3, 12);
scene.add(fillF);

// 바닥 — Figma 접지 그림자 (키보드·마우스 아래 뚜렷한 소프트 섀도)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.24 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// 그라운딩 블롭 섀도 — 애플 제품 렌더식: 넓고 매우 부드러운 저농도 타원,
// 본체+키보드 아래 중앙 배치 (가우시안 폴오프)
(function addBlobShadow() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 128, 0, 256, 128, 250);
  g.addColorStop(0, 'rgba(0,0,0,0.10)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.045)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(256, 128);
  ctx.scale(1, 0.5);
  ctx.translate(-256, -128);
  ctx.fillStyle = g;
  ctx.fillRect(0, -128, 512, 512);
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(9.5, 4.75),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  blob.rotation.x = -Math.PI / 2;
  blob.position.set(0, 0.002, 1.9);
  scene.add(blob);
}());

// ── Materials — Figma 실측: 완전 무채색 뉴트럴 그레이 (r=g=b) ───────────────
const whiteMat = new THREE.MeshStandardMaterial({
  color: 0xE9E9E9, roughness: 0.94, metalness: 0.0,
});
const recessMat = new THREE.MeshStandardMaterial({
  color: 0xD8D8D8, roughness: 0.96, metalness: 0.0,   // 리세스 = 은은한 AO 톤
});
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xA8A8A8, roughness: 0.92, metalness: 0.0,   // Figma 키캡 상면 155–178
});
const darkMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.75 });
const seamMat = new THREE.MeshStandardMaterial({ color: 0xC6C6C6, roughness: 0.95 });
const cableMat = new THREE.MeshStandardMaterial({ color: 0xE0E0E0, roughness: 0.9 });

// ── Helpers ────────────────────────────────────────────────────────────────
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function roundedBoxMesh(w, h, depth, r, mat, bevel) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), {
    depth, bevelEnabled: true,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 10,
  });
  geo.center();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ── 전체 세트 그룹 (마우스 추적 회전용) ────────────────────────────────────
const rig = new THREE.Group();
scene.add(rig);

// ═══════════════════════════════════════════════════════════════════════════
//  MACINTOSH 본체 — Figma 실측 비율
//  body 3.5 → recess 2.99(0.85) → CRT 2.70×2.025(0.77, 4:3)
// ═══════════════════════════════════════════════════════════════════════════
const mac = new THREE.Group();
rig.add(mac);

const BODY_W = 3.5, BODY_H = 4.4, BODY_D = 3.3, BODY_BEVEL = 0.05;
const body = roundedBoxMesh(BODY_W, BODY_H, BODY_D, 0.22, whiteMat, BODY_BEVEL);
const BODY_CY = BODY_H / 2 + 0.02;
body.position.set(0, BODY_CY, 0);
mac.add(body);

const FRONT_Z = BODY_D / 2 + BODY_BEVEL;

function onFront(mesh, x, y, z) {
  mesh.position.set(x, BODY_CY + y, z);
  mac.add(mesh);
  return mesh;
}

// 스크린 리세스 — Figma 실측: 상단 베젤 얇고(≈14px) 하단 두꺼움(≈53px), r≈6%
const recess = roundedBoxMesh(2.90, 2.725, 0.05, 0.18, recessMat, 0.02);
onFront(recess, 0, 0.65, FRONT_Z + 0.015);

// ── CRT 스크린 — Figma 실측 376×318px → 2.66×2.25 (1.182:1) ────────────────
const SCW = 2.66, SCH = 2.25;
const scrCanvas = document.createElement('canvas');
scrCanvas.width = 1440; scrCanvas.height = 1218;

// 정적 레이어 (배경 + 타이포) — 매 프레임 재사용
const staticC = document.createElement('canvas');
staticC.width = scrCanvas.width; staticC.height = scrCanvas.height;

const CRT_R = 153; // CRT 라운드 코너 (px) — Figma 실측 CRT 폭의 10.6%

function crtPath(ctx, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(w - r, 0);      ctx.quadraticCurveTo(w, 0, w, r);
  ctx.lineTo(w, h - r);      ctx.quadraticCurveTo(w, h, w - r, h);
  ctx.lineTo(r, h);          ctx.quadraticCurveTo(0, h, 0, h - r);
  ctx.lineTo(0, r);          ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
}

function renderStatic() {
  const ctx = staticC.getContext('2d');
  const w = staticC.width, h = staticC.height;

  // 코너 밖 = 조명 반영된 리세스 톤 (뉴트럴)
  ctx.fillStyle = '#F1F1F1';
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  crtPath(ctx, w, h, CRT_R);
  ctx.clip();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, w, h);

  // "Sejeong LEE" 워드마크 — Figma 원본 이미지 에셋 (360×80 박스,
  // 내부 이미지 w117.95% h215.6% offset(-7.82%, -58.1%) 크롭 그대로 재현)
  if (wordmarkImg.complete && wordmarkImg.naturalWidth) {
    const bx = w * 0.016, by = h * 0.4654, bw = w * 0.9574, bh = h * 0.2516;
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, by, bw, bh);
    ctx.clip();
    ctx.drawImage(wordmarkImg, bx - 0.0782 * bw, by - 0.581 * bh, 1.1795 * bw, 2.156 * bh);
    ctx.restore();
  }

  // 태그라인 — Figma: VT323 Regular 20px (CRT 높이의 6.29%), 베이스라인 81.4%
  const TL = 'HELLO WORLD, WELCOME TO MY WORKSPACE !';
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.font = Math.round(h * 0.0644) + 'px "VT323scr", monospace';
  ctx.fillText(TL, w * 0.516, h * 0.8145);

  // CRT 비네트 — 중심부만 순백, 가장자리 미세하게 어둡게 (뉴트럴)
  const vg = ctx.createRadialGradient(w/2, h*0.45, h*0.3, w/2, h*0.5, h*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.075)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // 스크린 베벨 인셋 섀도 — 상단에서 아래로 떨어지는 얕은 안쪽 그림자
  const tg = ctx.createLinearGradient(0, 0, 0, h * 0.08);
  tg.addColorStop(0, 'rgba(0,0,0,0.09)');
  tg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, w, h * 0.08);
  ctx.restore();
}

// data URI 로드 — file:// 에서 외부 이미지를 그리면 canvas가 tainted 되어
// THREE.CanvasTexture 업로드가 SecurityError로 실패하므로 반드시 임베드 사용
const tigerImg = new Image();
tigerImg.onload = renderStatic;
tigerImg.src = MAC3D_TIGER_SRC;

const wordmarkImg = new Image();
wordmarkImg.onload = renderStatic;
wordmarkImg.src = MAC3D_WORDMARK_SRC;

renderStatic();
try {
  const vt = new FontFace('VT323scr', 'url(src/fonts/VT323-Regular.ttf)');
  vt.load().then((f) => { document.fonts.add(f); renderStatic(); }).catch(() => {});
} catch (e) {}

// ── 인터랙션 상태 ──────────────────────────────────────────────────────────
const state = {
  hover: false,        // 스크린 호버
  warm: 0,             // 0→1 (호버 시 색온도/글로우)
  typed: '',
  booting: false,      // 부팅 페이드 진행 중
};

// ── 프레임 합성: 정적 레이어 + 호랑이 + 타이핑 + 웜 틴트 + 플래시 ──────────
function drawScreen(t, dt) {
  const ctx = scrCanvas.getContext('2d');
  const w = scrCanvas.width, h = scrCanvas.height;

  ctx.drawImage(staticC, 0, 0);

  ctx.save();
  crtPath(ctx, w, h, CRT_R);
  ctx.clip();

  // ① 호랑이 — Figma: 240×120 박스, CRT 폭 63.8%, 중앙 정렬, 정적
  if (tigerImg.complete && tigerImg.naturalWidth) {
    ctx.drawImage(tigerImg, w * 0.1755, h * 0.0881, w * 0.6383, h * 0.3774);
  }

  // ② 타이핑 라인 — 입력이 있을 때만 표시 (Figma 대기 화면엔 없음)
  if (state.typed.length > 0) {
    ctx.fillStyle = '#333333';
    ctx.textAlign = 'center';
    ctx.font = '400 34px Monaco, "Courier New", monospace';
    const line = state.typed.slice(-26).toUpperCase();
    const cursor = (Math.floor(t / 530) % 2 === 0) ? '▌' : ' ';
    ctx.fillText(line + cursor, w / 2, h * 0.92);
  }

  // ③ 호버: 웜 틴트 + 밝기
  if (state.warm > 0.01) {
    ctx.fillStyle = 'rgba(255, 240, 214, ' + (0.15 * state.warm).toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);
  }

  ctx.restore();
}

const scrTexture = new THREE.CanvasTexture(scrCanvas);
scrTexture.encoding = THREE.sRGBEncoding;
scrTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

const screenMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(SCW, SCH),
  new THREE.MeshBasicMaterial({ map: scrTexture })
);
onFront(screenMesh, 0, 0.79, FRONT_Z + 0.09);

// 호버 시 CRT 글로우 (웜 화이트)
const glow = new THREE.PointLight(0xFFE8C4, 0, 4.5);
glow.position.set(0, BODY_CY + 0.79, FRONT_Z + 1.0);
mac.add(glow);

// ═══ 친(chin) — Figma 실측 ══════════════════════════════════════════════════

// Apple 로고 (모노크롬)
const logoCanvas = document.createElement('canvas');
logoCanvas.width = 128; logoCanvas.height = 128;
(function drawLogo() {
  const ctx = logoCanvas.getContext('2d');
  ctx.save();
  ctx.translate(14, 18);
  const apple = new Path2D();
  apple.moveTo(50, 30);
  apple.bezierCurveTo(60, 16, 80, 19, 86, 35);
  apple.bezierCurveTo(94, 54, 85, 80, 66, 90);
  apple.bezierCurveTo(58, 94, 42, 94, 34, 90);
  apple.bezierCurveTo(15, 80, 6, 54, 14, 35);
  apple.bezierCurveTo(20, 19, 40, 16, 50, 30);
  apple.closePath();
  ctx.fillStyle = '#4A4A4A';
  ctx.fill(apple);
  ctx.beginPath();
  ctx.ellipse(60, 10, 14, 7, -0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(97, 52, 17, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}());
const logoTexture = new THREE.CanvasTexture(logoCanvas);
logoTexture.encoding = THREE.sRGBEncoding;
const logo = new THREE.Mesh(
  new THREE.PlaneGeometry(0.21, 0.225),
  new THREE.MeshBasicMaterial({ map: logoTexture, transparent: true })
);
onFront(logo, -1.482, -1.395, FRONT_Z + 0.008);

// 플로피 그루브 + 슬릿 — Figma 실측: 슬릿 107×14px(0.76×0.10), 중심 +0.37
const groove = roundedBoxMesh(0.84, 0.16, 0.03, 0.05, recessMat, 0.01);
onFront(groove, 0.37, -1.15, FRONT_Z + 0.012);
const slit = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.10, 0.02), darkMat);
onFront(slit, 0.37, -1.15, FRONT_Z + 0.045);

// 우측 블랙 인셋 플레이트 — Figma 실측: 91×29px(0.64×0.205), 중심 +1.10
const plate = roundedBoxMesh(0.72, 0.27, 0.04, 0.07, whiteMat, 0.012);
onFront(plate, 1.10, -1.15, FRONT_Z + 0.018);
const plateInset = roundedBoxMesh(0.64, 0.205, 0.02, 0.07, darkMat, 0.006);
onFront(plateInset, 1.10, -1.15, FRONT_Z + 0.046);

const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.02, 10), darkMat);
dot.rotation.x = Math.PI / 2;
onFront(dot, 1.48, -1.15, FRONT_Z + 0.008);

// 뒷면 통풍구
for (let i = 0; i < 8; i++) {
  const vent = new THREE.Mesh(
    new THREE.BoxGeometry(BODY_W * .72, 0.03, 0.02), seamMat
  );
  onFront(vent, 0, 1.4 - i * 0.17, -(FRONT_Z + 0.005));
}

// ═══════════════════════════════════════════════════════════════════════════
//  키보드 — M0110, 실제 키 입력 반응
// ═══════════════════════════════════════════════════════════════════════════
const kb = new THREE.Group();
kb.position.set(-0.25, 0.05, 3.22);   // Figma: 모니터 중심 대비 ≈35px 왼쪽
kb.rotation.x = 6.5 * DEG;
rig.add(kb);

const KB_W = 4.75, KB_D = 2.6;   // Figma 실측: 렌더 폭 = 본체의 1.45배, 깊이 178px

const kbLower = roundedBoxMesh(KB_W, KB_D, 0.28, 0.08, whiteMat, 0.02);
kbLower.rotation.x = -Math.PI / 2;
kbLower.position.y = 0.09;
kb.add(kbLower);

const kbUpper = roundedBoxMesh(KB_W - 0.12, KB_D - 0.12, 0.07, 0.06, whiteMat, 0.015);
kbUpper.rotation.x = -Math.PI / 2;
kbUpper.position.y = 0.20;
kb.add(kbUpper);

const KU = 0.255, PITCH = 0.305, KEY_H = 0.08;
const KEY_Y = 0.30;
const keyMap = {};   // KeyboardEvent.code → { mesh, baseY, press }

function addKey(x, z, wUnits, code) {
  const w = KU + (wUnits - 1) * PITCH;
  const key = roundedBoxMesh(w, KU * 0.9, KEY_H, 0.035, keyMat, 0.012);
  key.rotation.x = -Math.PI / 2;
  key.position.set(x + (w - KU) / 2, KEY_Y, z);
  kb.add(key);
  if (code) keyMap[code] = { mesh: key, baseY: KEY_Y, press: 0 };
  return wUnits * PITCH;
}

// 실제 배열 매핑 — 총 14.5u × 5줄
const layout = [
  [['Backquote',1],['Digit1',1],['Digit2',1],['Digit3',1],['Digit4',1],['Digit5',1],['Digit6',1],['Digit7',1],['Digit8',1],['Digit9',1],['Digit0',1],['Minus',1],['Equal',1],['Backspace',1.5]],
  [['Tab',1.5],['KeyQ',1],['KeyW',1],['KeyE',1],['KeyR',1],['KeyT',1],['KeyY',1],['KeyU',1],['KeyI',1],['KeyO',1],['KeyP',1],['BracketLeft',1],['BracketRight',1],['Backslash',1]],
  [['CapsLock',1.75],['KeyA',1],['KeyS',1],['KeyD',1],['KeyF',1],['KeyG',1],['KeyH',1],['KeyJ',1],['KeyK',1],['KeyL',1],['Semicolon',1],['Quote',1],['Enter',1.75]],
  [['ShiftLeft',2.25],['KeyZ',1],['KeyX',1],['KeyC',1],['KeyV',1],['KeyB',1],['KeyN',1],['KeyM',1],['Comma',1],['Period',1],['Slash',1],['ShiftRight',2.25]],
  [['AltLeft',1.5],['MetaLeft',1.25],['Space',9],['MetaRight',1.25],['AltRight',1.5]],
];
const MAIN_X0 = -2.21;
layout.forEach((row, r) => {
  let x = MAIN_X0;
  const z = -KB_D / 2 + 0.45 + r * PITCH;
  row.forEach(([code, u]) => { x += addKey(x, z, u, code); });
});

// ── 실제 키 입력 → 키 애니메이션 + 화면 타이핑 시뮬레이션 ──────────────────
window.addEventListener('keydown', (e) => {
  const k = keyMap[e.code];
  if (k) k.press = 1;
  if (e.metaKey || e.ctrlKey) return;
  if (e.key.length === 1) {
    state.typed = (state.typed + e.key).slice(-60);
  } else if (e.code === 'Backspace') {
    state.typed = state.typed.slice(0, -1);
  }
});
window.addEventListener('keyup', (e) => {
  const k = keyMap[e.code];
  if (k) k.press = 0;
});

// ═══════════════════════════════════════════════════════════════════════════
//  마우스 (M0100) — Figma 비율로 축소
// ═══════════════════════════════════════════════════════════════════════════
const mouse3d = new THREE.Group();
mouse3d.position.set(2.74, 0, 4.10);   // Figma: 키보드 우측 17px 갭, 바닥선 정렬
mouse3d.rotation.y = -0.06;
rig.add(mouse3d);

const mouseBody = roundedBoxMesh(0.80, 1.30, 0.34, 0.075, whiteMat, 0.022);
mouseBody.rotation.x = -Math.PI / 2;
mouseBody.position.y = 0.19;
mouse3d.add(mouseBody);

const mBtn = roundedBoxMesh(0.50, 0.30, 0.04, 0.03, keyMat, 0.01);
mBtn.rotation.x = -Math.PI / 2;
mBtn.position.set(0, 0.4, -0.35);
mouse3d.add(mBtn);

// 마우스 케이블
(function addCable() {
  const pts = [
    [2.42, 0.09, 3.6],
    [2.2, 0.05, 2.9],
    [1.95, 0.1, 2.2],
    [1.75, 0.25, 1.6],
  ].map(p => new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.022, 8), cableMat);
  tube.castShadow = true;
  rig.add(tube);
}());

// ═══════════════════════════════════════════════════════════════════════════
//  인터랙션 — 커서 추적(±4°/±2°) + 스크린 호버/클릭
// ═══════════════════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let targetRotY = 0, targetRotX = 0;

window.addEventListener('pointermove', (e) => {
  const nx = (e.clientX / window.innerWidth) * 2 - 1;   // -1 ~ 1
  const ny = (e.clientY / window.innerHeight) * 2 - 1;
  targetRotY = nx * 4 * DEG;     // 최대 ±4°
  targetRotX = ny * 2 * DEG;     // 최대 ±2°

  ndc.x = nx;
  ndc.y = -ny;
  raycaster.setFromCamera(ndc, camera);
  state.hover = !state.booting && raycaster.intersectObject(screenMesh).length > 0;
  canvas.style.cursor = state.hover ? 'pointer' : 'default';
});

// 스크린 클릭 → 부팅: 화이트 페이드 후 데스크탑(desktop.html)으로
canvas.addEventListener('click', () => {
  if (!state.hover || state.booting) return;
  state.booting = true;
  document.getElementById('overlay').classList.add('go');
  setTimeout(() => { window.location.href = 'desktop.html'; }, 650);
});

// ═══════════════════════════════════════════════════════════════════════════
//  Loop — 60fps, 시간 기반
// ═══════════════════════════════════════════════════════════════════════════
let prevT = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now();
  const dt = Math.min((t - prevT) / 1000, 0.05);
  prevT = t;

  // ① 브리딩 — 5.5s ease-in-out, 아주 미세한 상하 이동
  mac.position.y = Math.sin(t / 5500 * Math.PI * 2) * 0.018;

  // ② 커서 추적 회전 (부드러운 lerp, 절대 ±4°/±2° 초과 없음)
  rig.rotation.y += (targetRotY - rig.rotation.y) * 0.05;
  rig.rotation.x += (targetRotX - rig.rotation.x) * 0.05;

  // ③ 호버 상태 → 웜 틴트/글로우 lerp
  const warmTarget = state.hover ? 1 : 0;
  state.warm += (warmTarget - state.warm) * 0.08;
  glow.intensity = state.warm * 0.5;

  // ④ 키 프레스 애니메이션
  for (const code in keyMap) {
    const k = keyMap[code];
    const ty = k.baseY - 0.04 * k.press;
    k.mesh.position.y += (ty - k.mesh.position.y) * 0.4;
  }

  // ⑤ 스크린 합성
  drawScreen(t, dt);
  scrTexture.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

})();
</script>
