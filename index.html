<!--
  루트 랜딩 페이지(원래 media-archive.html이었던 실험 페이지를 2026-07-09에
  index.html로 승격). desktop.html/blair-os.html 및 공용 CSS/JS(script.js,
  style.css)를 전혀 참조하지 않는다 — 이 파일 하나가 스타일/스크립트를 전부
  인라인으로 갖고 있어 다른 페이지에 영향을 주지 않는 구조는 그대로 유지.
  이전 3D 매킨토시 랜딩(구 index.html)은 index-classic-mac-backup.html로
  보존됨(플로우에서 미사용, 참조용). media-archive.html 경로도 동일 내용의
  별칭으로 계속 서빙됨.

  헤드라인/코너/부팅 프롬프트 텍스트의 위치·크기·line-height·letter-spacing은
  Figma dev link 실측값 그대로(근사 아님): node 157:904(desktop) / 160:1309
  (mobile, ≤768px) — 중앙 텍스트 스택은 165:1027(desktop)/165:1026(mobile),
  부팅 프롬프트는 162:1024(desktop)/165:1024(mobile, VT323 20px/24px 공통).

  중앙 텍스트는 이제 "Press enter to boot..." 시스템 프롬프트를 겸한다 —
  Enter 키 또는 프롬프트 텍스트 클릭/탭으로 부팅 시퀀스가 시작되고
  desktop.html로 이동한다(아래 startBoot() 참고). 일반 캔버스 클릭으로는
  절대 이동하지 않음 — 드래그/줌은 부팅 전까지 그대로 살아있음.

  이번 패스는 검정 placeholder 사각형만 렌더링한다 — 실제 이미지/영상은 아직
  매핑하지 않음(요청 범위 밖). 실제 자산 연결 방법:
  1) data/media-archive-data.js 의 각 항목에 실제 src/width/height를 채운다.
  2) 이미지: src/images/media-archive/ 에 파일을 넣고 그 경로를 사용.
  3) 영상: src/video/media-archive/ 에 mp4를 넣고 type:'video'로 바꾼다.
  4) 아래 buildFragment()의 "TODO: 실제 미디어 매핑" 부분에 TextureLoader/
     VideoTexture 연결 로직을 추가하면 된다 — 위치/사이즈/애니메이션 골격은
     이미 완성되어 있어 매핑 코드만 끼워 넣으면 됨.
  5) public/ 디렉토리에는 절대 실제 자산을 넣지 말 것 — 이 프로젝트에서
     public/이 생기면 Vercel이 그걸 Output Directory로 오인해 배포 전체가
     깨진 전례가 있음(레포 히스토리 참고).
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }

@font-face {
  font-family: 'EB Garamond';
  src: url('src/fonts/EBGaramond-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal;
}
@font-face {
  font-family: 'VT323';
  src: url('src/fonts/VT323-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #fafaf8;   /* Figma: bg-[#fafaf8] */
}
body {
  font-family: 'Pretendard', -apple-system, 'Helvetica Neue', sans-serif;
  color: #000;
}

#c { position: fixed; inset: 0; display: block; z-index: 0; cursor: grab; transform-origin: 50% 50%; }
#c:active { cursor: grabbing; }

/* ── CRT 부팅 오버레이 — 평소엔 완전히 안 보이고 startBoot() 안에서만 잠깐
   나타난다. desktop.html은 완전히 별도 문서라 이 마크업/CSS 자체가 없음 —
   네비게이션 뒤에 남아있을 걱정이 구조적으로 없다. 타이밍/강도 파라미터는
   전부 아래 스크립트의 CRT_BOOT 객체 한 곳에서 조정한다. */
#crtNoise {
  position: fixed; inset: 0; z-index: 40; pointer-events: none;
  width: 100%; height: 100%; opacity: 0;
  image-rendering: pixelated;   /* 작은 해상도 캔버스를 확대해 거친 스태틱 입자로 보이게 */
}
#crtScanlines {
  position: fixed; inset: 0; z-index: 41; pointer-events: none;
  opacity: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 1px,
    rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px
  );
}

/* 부팅 시퀀스 마지막의 인광(phosphor) 플래시 — 라디얼 그라디언트라 중앙이
   먼저 밝아지는 "모니터가 켜지는" 느낌(플랫 화이트 박스가 순간 뜨는 것과
   다름). 평소엔 완전히 안 보임. */
#bootFlash {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, #fff 0%, #fff 45%, rgba(255,255,255,0.92) 100%);
  opacity: 0;
}

/* ── 코너 텍스트 — Figma node 157:908/157:911 (desktop, 2026-07-08 갱신본) ──
   좌/우 모두 top/left/right 20px(이전 24px에서 변경). Figma export 그대로:
   좌측 블록은 gap 없음, 우측 블록만 flex gap 2px — 비대칭이지만 실측값 그대로. */
.corner {
  position: fixed; top: 20px; z-index: 10; pointer-events: none;
  font-weight: 500;              /* Pretendard:Medium */
  font-size: 14px; line-height: 20px;
  opacity: 0;
}
.corner.left { left: 20px; }
.corner.right { right: 20px; text-align: right; }
.corner p { margin: 0; }
.corner.right p:first-child { margin-bottom: 2px; }   /* Figma: 우측 블록만 flex gap 2px */

/* ── 중앙 텍스트 스택 — Figma node 165:1027(desktop) / 165:1026(mobile) ──────
   헤드라인 + 부팅 프롬프트를 하나의 flex column으로 묶어 전체를 화면 정중앙에
   배치(gap 20px desktop / 16px mobile). 헤드라인 자체는 두 줄 다 동일 크기
   (EB Garamond Regular, line-height==font-size, letter-spacing -0.08em —
   96px/40px 어느 쪽이든 비율 동일해서 em 단위로 자동 스케일됨).
   .center-stack엔 pointer-events:none(드래그가 캔버스로 그대로 통과) —
   부팅 프롬프트만 별도로 pointer-events:auto로 켜서 그 텍스트만 클릭 가능. */
.center-stack {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 5; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  text-align: center; width: 653px; opacity: 0;
}
.headline { white-space: nowrap; }
.headline p {
  margin: 0;
  font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: 96px; line-height: 96px;
  letter-spacing: -0.08em;
}
/* ── 부팅 프롬프트 — Figma node 162:1024(desktop) / 165:1024(mobile), 두
   브레이크포인트 모두 20px/24px로 동일(글꼴만 VT323 — 이 프로젝트에서 이미
   태그라인/라벨/창 타이틀에 쓰던 폰트, src/fonts/VT323-Regular.ttf 재사용). */
.boot-prompt {
  margin: 0; pointer-events: auto; cursor: pointer;
  font-family: 'VT323', 'Courier New', monospace;
  font-weight: 400;
  font-size: 20px; line-height: 24px;
  letter-spacing: -0.03em;   /* Figma: -0.6px / 20px */
  white-space: nowrap;
  background: none; border: none; color: inherit; padding: 0;
}
.boot-cursor { display: inline-block; margin-left: 1px; animation: boot-blink 1s steps(1) infinite; }
@keyframes boot-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

@media (max-width: 768px) {
  .corner { top: 16px; font-size: 12px; line-height: 16px; }
  .corner.left { left: 16px; }
  .corner.right { right: 16px; }
  .center-stack { width: auto; gap: 16px; }
  .headline p { font-size: 40px; line-height: 40px; }
}

<div class="corner left"><p>SEJEONG LEE</p><p>Product Designer</p></div>
<div class="corner right"><p>Seoul, Korea</p><p>whynotblair@gmail.com</p></div>

<div class="center-stack">
  <div class="headline">
    <p>Hello world</p>
    <p>Welcome to my space.</p>
  </div>
  <div class="boot-prompt" id="bootPrompt" role="button" tabindex="0" aria-label="Press enter to boot"><span id="bootPromptText"></span><span class="boot-cursor" aria-hidden="true">_</span></div>
</div>

<canvas id="c"></canvas>
<canvas id="crtNoise" aria-hidden="true"></canvas>
<div id="crtScanlines" aria-hidden="true"></div>
<div id="bootFlash"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="data/media-archive-data.js"></script>
<script>
(function () {
'use strict';

if (!window.MEDIA_ARCHIVE_DATA || !window.MEDIA_ARCHIVE_DATA.length) {
  console.error('media-archive: window.MEDIA_ARCHIVE_DATA missing — check data/media-archive-data.js load order');
  return;
}

// ── Renderer / Scene / Camera ───────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;

const BG = 0xfafaf8;   // Figma: #fafaf8
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 17);   // GSAP가 14로 돌리인 — 아래 인트로 참고(이전 22→18보다 훨씬 가깝게)
camera.lookAt(0, 0, 0);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── OrbitControls — 드래그 회전 + 스크롤 줌, 범위 제한 + 댐핑 ──────────────
// 줌아웃 최대치를 크게 낮췄다(26→18) — 이전엔 최대로 줌아웃하면 파티클 필드가
// 화면 안에서 너무 작아져 백지에 가까워지는 문제가 있었음(실측 확인 필요 사항).
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;              // 타깃 고정 — 구도가 화면 밖으로 안 밀림
controls.minDistance = 8;
controls.maxDistance = 18;
controls.minPolarAngle = Math.PI * 0.28; // 너무 위/아래로 뒤집혀 길 잃지 않도록 제한
controls.maxPolarAngle = Math.PI * 0.72;
controls.rotateSpeed = 0.45;
controls.zoomSpeed = 0.6;
controls.target.set(0, 0, 0);
// 유휴 상태에서도 "은은하게 살아있는" 느낌을 주는 아주 느린 자동 공전 —
// 사용자가 드래그하면 OrbitControls가 그 입력을 우선하고, 손을 떼면 다시
// 이 느린 자동 회전으로 돌아온다(라이브러리 기본 동작, 별도 상태 관리 불필요).
controls.autoRotate = true;
controls.autoRotateSpeed = 0.12;

// ── 미디어 파티클 — 검정 PlaneGeometry, 항상 카메라를 향하는 빌보드 ─────────
// 색/기울임 있는 파스텔 카드는 전부 제거 — 지금은 순수 검정 사각형만.
// 회전은 절대 랜덤으로 주지 않는다: 매 프레임 카메라 쿼터니언을 그대로 복사해
// "빌보드"로 만들어, OrbitControls로 궤도를 돌려도 사각형이 항상 정면을
// 보고 반듯하게 서 있다(perspective로 인한 크기 변화는 자연스러운 원근일 뿐
// 의도적인 기울임이 아님).
//
// 헤드라인/코너 텍스트를 실제로 가리지 않도록, 후보 위치를 실제 카메라로
// 투영(project)해 화면 비율 좌표로 바꾼 뒤 "UI가 있는 영역"이면 재추첨한다.
//
// 실측으로 발견한 버그 1: 빌드 시점 카메라 거리 하나만으로 검사하면, 사용자가
// 최대로 줌인(가까운 거리)했을 때 카메라 각도에 따라 같은 월드 좌표가 화면
// 코너 쪽으로 더 밀려나 코너 텍스트를 가리는 경우가 실제로 발생했다(스크린샷
// 확인). 그래서 minDistance/기본거리/maxDistance 세 지점 모두에서 화면상
// 겹치지 않는지 확인 — 하나라도 겹치면 재추첨한다.
//
// 실측으로 발견한 버그 2: 하드코딩한 화면비율 값(예: sx<0.2)은 넓은 데스크톱
// 프레임 기준으로 잡은 것이라, 좁은 모바일 세로 화면(예: 390px)에서는 코너
// 텍스트 블록이 차지하는 비율 자체가 훨씬 커져서 보호구역이 실제 텍스트보다
// 좁아지는 문제가 있었다(모바일 스크린샷에서 코너 텍스트가 파티클에 가려짐을
// 확인). 그래서 하드코딩 대신 실제 DOM 요소의 getBoundingClientRect()를
// 읽어 화면 비율로 변환 — 뷰포트 크기/비율이 뭐든 실제 텍스트 박스 그대로 보호.
camera.updateMatrixWorld(true);
const _proj = new THREE.Vector3();
const _savedCamPos = new THREE.Vector3();

function elRectFraction(el, marginPx) {
  const r = el.getBoundingClientRect();
  return {
    x0: (r.left - marginPx) / window.innerWidth,
    x1: (r.right + marginPx) / window.innerWidth,
    y0: (r.top - marginPx) / window.innerHeight,
    y1: (r.bottom + marginPx) / window.innerHeight,
  };
}
// 커스텀 폰트(EB Garamond/VT323) 로딩 전 폴백 폰트 크기로 잴 수 있어 여유를
// 넉넉히 둔다(24px) — 실제 텍스트 자체는 처음에 opacity:0라 안 보이므로,
// 보호구역이 약간 넓게 잡히는 쪽은 무해하고 좁게 잡히는 쪽만 문제가 된다.
const MARGIN = 24;
const headlineBox = elRectFraction(document.querySelector('.center-stack'), MARGIN);
const cornerLeftBox = elRectFraction(document.querySelector('.corner.left'), MARGIN);
const cornerRightBox = elRectFraction(document.querySelector('.corner.right'), MARGIN);

function inBox(sx, sy, box) {
  return sx > box.x0 && sx < box.x1 && sy > box.y0 && sy < box.y1;
}
function isClearOfUI(wx, wy, wz) {
  _proj.set(wx, wy, wz).project(camera);
  const sx = (_proj.x + 1) / 2;        // 0..1, 왼쪽→오른쪽
  const sy = (1 - _proj.y) / 2;        // 0..1, 위→아래(CSS 좌표계로 변환)
  return !inBox(sx, sy, headlineBox) && !inBox(sx, sy, cornerLeftBox) && !inBox(sx, sy, cornerRightBox);
}
const CHECK_DISTANCES = [8, 14, 18];   // controls.minDistance / 기본 정착 거리 / controls.maxDistance
// 실측으로 발견한 버그 3: 중심점 하나만 검사하면 큰 anchor 파티클(최대 2.3
// 유닛)은 중심이 보호구역 밖이어도 실제 렌더된 사각형의 가장자리가 여전히
// 텍스트 위를 덮는 경우가 있었다(모바일 스크린샷에서 확인). 그래서 중심 +
// 네 모서리(halfW/halfH만큼 오프셋) 총 5개 지점을 전부 검사한다 — 빌보드가
// 카메라를 향하므로 카메라 정면에 가까운 배치에서는 월드 X/Y 오프셋이
// 화면상 좌우/상하 오프셋의 합리적인 근사치가 된다.
function isClearAtAllZoomLevels(wx, wy, wz, halfW, halfH) {
  _savedCamPos.copy(camera.position);
  let clear = true;
  const points = [
    [wx, wy, wz],
    [wx - halfW, wy - halfH, wz], [wx + halfW, wy - halfH, wz],
    [wx - halfW, wy + halfH, wz], [wx + halfW, wy + halfH, wz],
  ];
  outer:
  for (const d of CHECK_DISTANCES) {
    camera.position.set(0, 0, d);
    camera.updateMatrixWorld(true);
    for (const p of points) {
      if (!isClearOfUI(p[0], p[1], p[2])) { clear = false; break outer; }
    }
  }
  camera.position.copy(_savedCamPos);
  camera.updateMatrixWorld(true);
  return clear;
}

const group = new THREE.Group();
scene.add(group);

const fragments = [];

function randRange(a, b) { return a + Math.random() * (b - a); }

// ── 실제 미디어 로딩 — 이미지는 TextureLoader, 영상은 <video>+VideoTexture ──
// 검정 placeholder(mat.color 0x000000, map 없음)로 시작해서, 로드에 성공한
// 프래그먼트만 map/color를 갈아끼운다. 파일이 없거나(404) 로드 실패하면
// 아무것도 하지 않고 검정 placeholder를 그대로 둔다 — 빈 상태 문구 없음.
const textureLoader = new THREE.TextureLoader();
const videoEls = [];

const FRAG_ASPECT_MIN = 0.55;   // 9:16(0.5625) 세로 영상/사진까지 클램프 없이 커버
const FRAG_ASPECT_MAX = 1.8;    // 16:9(1.778) 가로 영상까지 클램프 없이 커버
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

// 크롭(cover) 대신 프레임 자체를 미디어 실측 비율에 맞춘다 — 가장 긴 변은
// buildFragment에서 정한 sizeScale(티어별 크기)을 그대로 유지하고, 짧은 변만
// 비율에 맞게 다시 계산한다(= buildFragment의 dims 계산식과 동일한 공식,
// item.width/height 대신 실측 mediaAspect를 사용). 너무 극단적인 비율(예:
// 초와이드 영상)은 레이아웃이 깨지지 않게 clamp한다.
function applyAspectToFragment(frag, mediaAspect) {
  const aspect = clamp(mediaAspect, FRAG_ASPECT_MIN, FRAG_ASPECT_MAX);
  const scale = frag.sizeScale;
  frag.dims.w = aspect >= 1 ? scale : scale * aspect;
  frag.dims.h = aspect >= 1 ? scale / aspect : scale;
  // 인트로 트윈이 이미 끝났거나 진행 중이어도(proxy.p가 0~1 사이 어떤 값이든)
  // 즉시 새 비율을 반영 — 진행 중인 트윈은 다음 tick부터 새 dims를 계속 사용.
  frag.mesh.scale.set(frag.dims.w * frag.proxy.p, frag.dims.h * frag.proxy.p, 1);
}

function applyTextureToFragment(frag, texture, mediaAspect) {
  texture.encoding = THREE.sRGBEncoding;
  texture.minFilter = THREE.LinearFilter;
  texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
  applyAspectToFragment(frag, mediaAspect);
  frag.mat.map = texture;
  frag.mat.color.set(0xffffff);   // 텍스처가 원색 그대로 보이도록(검정 곱연산 방지)
  frag.mat.needsUpdate = true;
}

function loadFragmentMedia(item, frag) {
  if (!item.src) return;   // src 없음 — 검정 placeholder 유지
  if (item.type === 'video') {
    const video = document.createElement('video');
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.autoplay = true;
    video.addEventListener('loadedmetadata', () => {
      const texture = new THREE.VideoTexture(video);
      applyTextureToFragment(frag, texture, video.videoWidth / video.videoHeight);
      video.play().catch(() => {});   // 자동재생 정책으로 막혀도 조용히 무시(검정 유지)
    });
    video.addEventListener('error', () => { /* 로드 실패 — 검정 placeholder 유지 */ });
    video.src = item.src;
    video.load();
    frag.videoEl = video;
    videoEls.push(video);
  } else {
    textureLoader.load(
      item.src,
      (texture) => {
        const img = texture.image;
        const mediaAspect = (img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : item.width / item.height;
        applyTextureToFragment(frag, texture, mediaAspect);
      },
      undefined,
      () => { /* 로드 실패 — 검정 placeholder 유지 */ }
    );
  }
}

// 크기 티어 — "적은 수의 큰 앵커 + 많은 중/소형"으로 밀도감을 만든다.
// 앵커는 카메라에 가깝게, 소형은 멀게 둬서 "큰 게 가깝다"는 자연스러운
// 원근 상관관계를 만들고(별도 near/far 플래그가 필요 없어짐), 평균 크기는
// 이전 대비 약 1.6배, 최대 크기는 약 2배로 커졌다.
const SIZE_TIERS = [
  { weight: 0.16, size: [1.8, 2.3], z: [4, 9] },     // anchor — 소수의 큰 파티클
  { weight: 0.42, size: [0.9, 1.5], z: [-3, 6] },    // medium
  { weight: 1.00, size: [0.45, 0.85], z: [-11, -2] }, // small — 그래도 "티끌"처럼 작진 않게
];
function pickTier() {
  const r = Math.random();
  for (const t of SIZE_TIERS) if (r < t.weight) return t;
  return SIZE_TIERS[SIZE_TIERS.length - 1];
}

function buildFragment(item) {
  const tier = pickTier();
  const sizeScale = randRange(tier.size[0], tier.size[1]);

  // 사이즈/종횡비를 위치보다 먼저 정한다 — 아래 배치 검사가 파티클의 실제
  // 크기(halfW/halfH)까지 감안해야 큰 anchor 파티클의 가장자리가 텍스트를
  // 덮는 걸 막을 수 있다(중심점만 보던 이전 방식의 버그, 위 주석 참고).
  const aspect = item.width / item.height;
  const dims = {
    w: aspect >= 1 ? sizeScale : sizeScale * aspect,
    h: aspect >= 1 ? sizeScale / aspect : sizeScale,
  };

  // 헤드라인을 "고리(halo)"처럼 감싸도록, 완전 균일 랜덤 대신 극좌표로 뽑아
  // 반경을 보호구역 바로 바깥쪽에 몰아준다(rBias 지수<1 → 작은 반경 쪽으로 편향).
  // 그래도 최종적으로는 항상 isClearOfUI로 화면상 실제 겹침 여부를 재확인한다 —
  // "텍스트 위에 놓고 안 보이게 처리"가 아니라 애초에 그 자리에 놓지 않는 방식.
  let x, y, z;
  let tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const rBias = Math.pow(Math.random(), 0.55);
    const r = 2.6 + rBias * 8.6;
    x = Math.cos(angle) * r * 1.2;
    y = Math.sin(angle) * r * 0.7;
    z = randRange(tier.z[0], tier.z[1]);
    tries++;
  } while (!isClearAtAllZoomLevels(x, y, z, dims.w / 2, dims.h / 2) && tries < 20);

  const finalPos = { x, y, z };
  // "3D 아카이브 공간으로 퍼져나가는" 인트로 모션을 위한 시작 위치 — 최종
  // 위치보다 훨씬 중심(원점)에 가깝게 시작해서 인트로 동안 바깥으로 퍼진다.
  const startPos = { x: x * 0.18, y: y * 0.18, z: z * 0.18 };

  const geo = new THREE.PlaneGeometry(1, 1);   // 실제 크기는 mesh.scale로 표현(아래)
  const mat = new THREE.MeshBasicMaterial({
    color: 0x000000,   // 미디어 로드 전/실패 시 계속 유지되는 검정 placeholder
    transparent: true, opacity: 0,
    side: THREE.DoubleSide, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(startPos.x, startPos.y, startPos.z);
  mesh.scale.set(0.0001, 0.0001, 1);
  group.add(mesh);

  const proxy = { p: 0 };   // GSAP 인트로(0→1)가 구동 — scale/opacity/position 전부 여기서 파생

  // 유휴 시 아주 은은하게 떠 있는 느낌을 주는 개별 bob(위아래 미세 흔들림) 파라미터 —
  // 인트로가 끝난 뒤에만 적용(아래 animate 루프 참고), 진폭이 작아 산만하지 않음.
  const bob = { amp: randRange(0.03, 0.09), speed: randRange(0.12, 0.3), phase: randRange(0, Math.PI * 2) };

  const frag = { mesh, mat, proxy, dims, sizeScale, startPos, finalPos, targetOpacity: 1, bob, introDone: false, videoEl: null };
  return frag;
}

// 파티클/텍스처 개수가 많아서(현재 30여 개 이미지 + 영상 여러 개) 페이지 로드
// 시점에 전부 한꺼번에 fetch+decode+GPU 업로드를 시작하면 초기 버벅거림과
// "이미지가 뒤늦게 팝인"하는 현상이 생긴다. 그래서 미디어 로드 시작 자체를
// 아이템당 조금씩(스태거) 늦춰서 네트워크/디코드 부하를 첫 몇 초에 걸쳐
// 분산시킨다 — 파티클 생성(배치/애니메이션 골격)은 여전히 즉시 전부 이루어짐,
// 늦어지는 건 오직 "실제 미디어를 언제부터 불러오기 시작하느냐"뿐이다.
const MEDIA_LOAD_STAGGER_MS = 55;
window.MEDIA_ARCHIVE_DATA.forEach((item, i) => {
  const frag = buildFragment(item);
  fragments.push(frag);
  setTimeout(() => loadFragmentMedia(item, frag), i * MEDIA_LOAD_STAGGER_MS);
});

// ── 부팅 프롬프트 — 타이핑 효과 + Enter/클릭 트리거 + 부팅 시퀀스 ───────────
const PROMPT_TEXT = 'Press enter to boot...';
const BOOTING_TEXT = 'booting workspace...';
const bootPromptEl = document.getElementById('bootPrompt');
const bootPromptTextEl = document.getElementById('bootPromptText');
const bootFlashEl = document.getElementById('bootFlash');
const crtNoiseEl = document.getElementById('crtNoise');
const crtScanlineEl = document.getElementById('crtScanlines');
let booting = false;

// ── CRT 부팅 오버레이 튜닝 값 — 전부 여기 한 곳에서 조정 ────────────────────
const CRT_BOOT = {
  noiseOpacity: 0.18,     // 스태틱 노이즈 최대 불투명도 (권장 0.12–0.25)
  scanlineOpacity: 0.15,  // 스캔라인 최대 불투명도
  squeezeAmount: 0.985,   // 신호 스퀴즈 시 캔버스 scaleY 최소값(1에 가까울수록 은은)
  flashDuration: 150,     // 인광 플래시 페이드인 시간, ms (권장 120–180)
  noiseStart: 250,        // 부팅 시작 후 노이즈/스캔라인이 나타나는 시점, ms
  noiseHold: 320,         // 노이즈 버스트 지속 시간, ms (권장 250–400)
  squeezeStart: 500,      // 신호 스퀴즈/스냅이 일어나는 시점, ms
  squeezeDuration: 160,   // 스퀴즈 다운+업 왕복 총 시간, ms
  flashStart: 750,        // 인광 플래시가 시작되는 시점, ms
  totalDuration: 1000,    // 부팅 시작~desktop.html 이동까지 총 시간, ms (권장 900–1100)
};

// 작은 해상도 캔버스에 매 프레임 랜덤 그레이스케일 픽셀을 그려 CSS
// image-rendering:pixelated로 확대 — 매끈한 비디오 노이즈가 아니라 거친
// "신호 노이즈"로 읽히게 하는 게 목적(공포/VHS 글리치 느낌 지양).
const noiseCtx = crtNoiseEl.getContext('2d');
const NOISE_W = 128, NOISE_H = 80;
crtNoiseEl.width = NOISE_W;
crtNoiseEl.height = NOISE_H;

function drawNoiseFrame() {
  const img = noiseCtx.createImageData(NOISE_W, NOISE_H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  noiseCtx.putImageData(img, 0, 0);
}

// durationMs 동안 ~40ms 간격으로만 노이즈 프레임을 갱신 — 매 rAF 프레임 다시
// 그리지 않아 가볍고, 약간 끊기는 느낌이 오히려 "신호"답게 읽힌다.
function playNoiseBurst(durationMs) {
  const start = performance.now();
  let last = 0;
  function tick(now) {
    if (now - start > durationMs) return;
    if (now - last >= 40) { drawNoiseFrame(); last = now; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// 한 글자씩 타이핑 — 터미널/시스템 프롬프트 느낌, 절제된 속도.
function typePrompt() {
  let i = 0;
  bootPromptTextEl.textContent = '';
  (function step() {
    if (booting) return;   // 타이핑 도중 부팅이 시작되면 즉시 중단(아래서 텍스트를 직접 교체함)
    bootPromptTextEl.textContent = PROMPT_TEXT.slice(0, i);
    i++;
    if (i <= PROMPT_TEXT.length) setTimeout(step, 26);
  }());
}

// 부팅 시퀀스 — Enter 또는 프롬프트 클릭/탭으로 트리거. 총 소요시간 약 1초
// (CRT_BOOT.totalDuration). ①인터랙션 차단 ②프롬프트 텍스트 전환(플리커)
// ③파티클이 잠깐 멈췄다 중심/안쪽으로 빨려들며 축소+페이드 ④헤드라인 은은하게
// 페이드+축소 ⑤CRT 신호 부팅(스태틱 노이즈 버스트 → 스캔라인 → 화면 스퀴즈
// 스냅 → 인광 플래시) ⑥desktop.html 이동. 검정 사각형은 절대 회전하지 않고
// 계속 빌보드 유지(아래 animate 루프에서 매 프레임 카메라 쿼터니언을 계속 복사함).
function startBoot() {
  if (booting) return;
  booting = true;

  // ① 인터랙션 차단 — 드래그/줌/자동공전/유휴 bob 전부 정지
  controls.enabled = false;
  controls.autoRotate = false;

  // ② 프롬프트 텍스트를 짧은 플리커와 함께 "booting workspace..."로 교체
  gsap.timeline()
    .to(bootPromptEl, { opacity: 0.12, duration: 0.05 })
    .call(() => { bootPromptTextEl.textContent = BOOTING_TEXT; })
    .to(bootPromptEl, { opacity: 1, duration: 0.12 });

  // ③ 파티클 — 잠깐 정지 후 중심/뒤쪽으로 빨려들며 축소+페이드
  // ("보관소가 워크스페이스로 흡수되는" 느낌 — 인트로의 startPos→finalPos 확산을
  // 거꾸로 되감는 것과 개념적으로 대응되는 모션).
  fragments.forEach((f) => {
    const p = { v: 0 };
    const pause = 0.08 + Math.random() * 0.1;
    gsap.to(p, {
      v: 1, duration: 0.45 + Math.random() * 0.15, delay: pause, ease: 'power2.in',
      onUpdate: () => {
        f.mesh.position.set(
          THREE.MathUtils.lerp(f.finalPos.x, f.finalPos.x * 0.08, p.v),
          THREE.MathUtils.lerp(f.finalPos.y, f.finalPos.y * 0.08, p.v),
          THREE.MathUtils.lerp(f.finalPos.z, f.finalPos.z * 0.08 - 5, p.v)
        );
        const s = 1 - p.v * 0.6;
        f.mesh.scale.set(f.dims.w * s, f.dims.h * s, 1);
        f.mat.opacity = f.targetOpacity * (1 - p.v);
      },
    });
  });

  // ④ 헤드라인 — 아주 은은하게 페이드+축소(과하게 애니메이션하지 않음)
  gsap.to('.headline', { opacity: 0.15, scale: 0.97, duration: 0.5, ease: 'power2.in' });

  // ⑤ CRT 신호 부팅 — 스태틱 노이즈 버스트 + 스캔라인 + 화면 스퀴즈 스냅 +
  // 인광 플래시. 공포/VHS 글리치가 아니라 "오래된 모니터가 켜지는" 느낌으로
  // 절제되게. 모든 타이밍/강도는 위 CRT_BOOT 객체 하나로 조정.
  const crtTl = gsap.timeline();
  crtTl
    // 노이즈+스캔라인 페이드인, 동시에 노이즈 캔버스 프레임 재생 시작
    .to(crtNoiseEl, { opacity: CRT_BOOT.noiseOpacity, duration: 0.04 }, CRT_BOOT.noiseStart / 1000)
    .to(crtScanlineEl, { opacity: CRT_BOOT.scanlineOpacity, duration: 0.04 }, CRT_BOOT.noiseStart / 1000)
    .call(() => playNoiseBurst(CRT_BOOT.noiseHold), null, CRT_BOOT.noiseStart / 1000)
    // 노이즈만 먼저 은은하게 페이드아웃(스캔라인은 플래시 직전까지 유지)
    .to(crtNoiseEl, { opacity: 0, duration: 0.12 }, (CRT_BOOT.noiseStart + CRT_BOOT.noiseHold) / 1000)
    // 신호 스퀴즈/스냅 — 캔버스만 짧게 scaleY로 눌렸다 복귀(레이아웃 영구 변형 없음)
    .to(canvas, { scaleY: CRT_BOOT.squeezeAmount, duration: CRT_BOOT.squeezeDuration / 2 / 1000, ease: 'power1.in' }, CRT_BOOT.squeezeStart / 1000)
    .to(canvas, { scaleY: 1, duration: CRT_BOOT.squeezeDuration / 2 / 1000, ease: 'power1.out' })
    // 인광 플래시 — 라디얼 화이트가 중앙부터 은은하게 차오르며 화면을 덮는다
    .to(crtScanlineEl, { opacity: 0, duration: 0.08 }, CRT_BOOT.flashStart / 1000)
    .to(bootFlashEl, { opacity: 1, duration: CRT_BOOT.flashDuration / 1000, ease: 'power2.in' }, CRT_BOOT.flashStart / 1000);

  // ⑥ 이동 — CRT_BOOT.totalDuration(기본 1000ms) 후 desktop.html로.
  setTimeout(() => { window.location.href = 'desktop.html'; }, CRT_BOOT.totalDuration);
}

window.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || booting) return;
  startBoot();
});
bootPromptEl.addEventListener('click', () => { startBoot(); });

// ── GSAP 인트로 — ①코너 페이드 ②헤드라인+프롬프트 스택 정착 ③프롬프트 텍스트
// 타이핑 ④(헤드라인 이후) 검정 파티클이 스태거로 스케일/페이드/위치와 함께
// 퍼져나감 ⑤카메라 돌리인 ──────────────────────────────────────────────────
const HEADLINE_SETTLE = 1.5;   // 헤드라인 스택 애니메이션이 대략 끝나는 시점(초)

const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
tl.to('.corner', { opacity: 1, duration: 0.7 }, 0)
  .to('.center-stack', { opacity: 1, duration: 1.3 }, 0.2)
  .to(camera.position, { z: 14, duration: 2.6, ease: 'power2.out' }, 0.3)
  .call(() => { typePrompt(); }, null, 1.2);

fragments.forEach((f) => {
  const delay = HEADLINE_SETTLE + Math.random() * 1.4;
  tl.to(f.proxy, {
    p: 1, duration: 1.2 + Math.random() * 0.4, ease: 'power2.out',
    onUpdate: () => {
      if (booting) return;   // 부팅이 먼저 시작되면 인트로가 더 이상 transform을 건드리지 않음
      const p = f.proxy.p;
      f.mesh.scale.set(f.dims.w * p, f.dims.h * p, 1);
      f.mat.opacity = f.targetOpacity * p;
      f.mesh.position.set(
        THREE.MathUtils.lerp(f.startPos.x, f.finalPos.x, p),
        THREE.MathUtils.lerp(f.startPos.y, f.finalPos.y, p),
        THREE.MathUtils.lerp(f.startPos.z, f.finalPos.z, p)
      );
    },
    onComplete: () => { f.introDone = true; },
  }, delay);
});

// ── Loop — 매 프레임 파티클이 카메라 쿼터니언을 복사(빌보드) + 인트로가 끝난
// 파티클만 아주 작은 진폭으로 위아래 bob(유휴 모션) ───────────────────────
let rafId = null;
let renderPaused = false;

function animate() {
  rafId = requestAnimationFrame(animate);
  if (renderPaused) return;   // 탭이 백그라운드일 때는 렌더/업데이트를 완전히 건너뜀
  controls.update();
  const t = performance.now() * 0.001;
  for (let i = 0; i < fragments.length; i++) {
    const f = fragments[i];
    f.mesh.quaternion.copy(camera.quaternion);   // 부팅 중에도 계속 빌보드 유지(요청사항)
    if (f.introDone && !booting) {
      const offset = Math.sin(t * f.bob.speed + f.bob.phase) * f.bob.amp;
      f.mesh.position.set(f.finalPos.x, f.finalPos.y + offset, f.finalPos.z);
    }
  }
  renderer.render(scene, camera);
}
animate();

// ── 성능/리소스 정리 ─────────────────────────────────────────────────────
// 이 페이지가 실제 3D 씬(50개 메시 + OrbitControls + rAF 루프)을 계속 돌리기
// 때문에, 백그라운드 탭으로 방치되거나 다른 페이지로 이동할 때 자원을 확실히
// 놓아주지 않으면 브라우저 전체 성능에 영향을 줄 수 있다 — 아래 두 핸들러로 대응.
document.addEventListener('visibilitychange', () => {
  renderPaused = document.hidden;   // 백그라운드 탭에서는 렌더 루프를 정지(재생 중에도 리소스 절약)
});

function disposeScene() {
  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  gsap.globalTimeline.clear();   // 진행 중이던 인트로/부팅 트윈 전부 정리
  controls.dispose();
  scene.traverse((obj) => {
    if (obj.isMesh) {
      obj.geometry?.dispose();
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach((m) => { m?.map?.dispose(); m?.dispose(); });
    }
  });
  videoEls.forEach((video) => { video.pause(); video.removeAttribute('src'); video.load(); });
  renderer.dispose();
}
// pagehide는 일반 내비게이션(location.href 이동 포함)과 탭 종료 모두에서 발생 —
// beforeunload보다 bfcache와 호환성이 좋아 이쪽을 사용.
window.addEventListener('pagehide', disposeScene);

})();
</script>
</body>
</html>
